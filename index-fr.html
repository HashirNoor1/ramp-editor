<!doctype html>
<html lang="fr" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta content="width=device-width,initial-scale=1" name="viewport" />

        <title>R&D de l'éditeur d'applications PCAR</title>

        <!-- Load stylesheet -->
        <link rel="stylesheet" href="https://www.canada.ca/etc/designs/canada/cdts/gcweb/v5_0_2/cdts/cdts-styles.css" />

        <!-- Load/activate closure template scripts -->
        <script
            src="https://www.canada.ca/etc/designs/canada/cdts/gcweb/v5_0_2/cdts/compiled/wet-fr.js"
            data-cdts-setup='{"cdnEnv": "prod"}'
        ></script>
        <link rel="stylesheet" href="./ramp/ramp.css" />
    </head>
    <body>
        <!-- template top and no-script fallback -->
        <div id="def-top"></div>

        <div id="wb-cont">
            <div id="app"></div>
        </div>

        <!-- template footer and no-script fallback -->
        <div id="def-footer"></div>

        <script type="text/javascript">
            var defTop = document.getElementById('def-top');
            defTop.outerHTML = wet.builder.top({
                lngLinks: [
                    {
                        lang: 'en',
                        href: 'index.html',
                        text: 'English'
                    }
                ]
            });
        </script>

        <script>
            var defFooter = document.getElementById('def-footer');
            defFooter.outerHTML = wet.builder.footer({});
        </script>

        <script type="module" src="/src/main.ts"></script>
        <script src="./ramp/ramp.browser.iife.js"></script>

        <style>
            html {
                font-size: 16px;
            }
        </style>
    </body>
</html>
